<text x="24" y="66" fill="#7fc492">$ <tspan fill="#f3f0e8">hush --help</tspan></text>
<text x="24" y="86" fill="#d8d3c8" xml:space="preserve">Usage: hush [options] [command]</text>
<text x="24" y="106" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">hush — the secrets employee. Issued, never leaked. Rotated, then proven.</text>
<text x="24" y="146" fill="#d8d3c8" xml:space="preserve">Returns handles, never values.</text>
<text x="24" y="166" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="186" fill="#d8d3c8" xml:space="preserve">Options:</text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve">  -v, --version                       print the hush version</text>
<text x="24" y="226" fill="#d8d3c8" xml:space="preserve">  -h, --help                          display help for command</text>
<text x="24" y="246" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="266" fill="#d8d3c8" xml:space="preserve">Commands:</text>
<text x="24" y="286" fill="#d8d3c8" xml:space="preserve">  scan [options] [path]               scan a repo for leaked secrets (exit 1 on</text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve">                                      any finding)</text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve">  doctor [options] [path]             report the secret-manager wiring of a</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">                                      repo</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve">  advise [options] &lt;situation&gt;        verdict + doctrine for a</text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve">                                      remediation/rotation question</text>
<text x="24" y="406" fill="#d8d3c8" xml:space="preserve">  remediate [options] &lt;finding&gt;       ordered rotate-first remediation plan for</text>
<text x="24" y="426" fill="#d8d3c8" xml:space="preserve">                                      a finding</text>
<text x="24" y="446" fill="#d8d3c8" xml:space="preserve">  rotate-plan [options] &lt;secret-ref&gt;  ISSUE→DEPLOY→VERIFY→REVOKE rotation plan</text>
<text x="24" y="466" fill="#d8d3c8" xml:space="preserve">                                      for a secret</text>
<text x="24" y="486" fill="#d8d3c8" xml:space="preserve">  init [options]                      scaffold</text>
<text x="24" y="506" fill="#d8d3c8" xml:space="preserve">                                      scanner/SOPS/gitignore/.env.example setup</text>
<text x="24" y="526" fill="#d8d3c8" xml:space="preserve">  env-example [options] [path]        generate .env.example from the repo's</text>
<text x="24" y="546" fill="#d8d3c8" xml:space="preserve">                                      real var schema (S-14)</text>
<text x="24" y="566" fill="#d8d3c8" xml:space="preserve">  broker [options] &lt;secret-name&gt;      return a short-TTL handle for a secret</text>
<text x="24" y="586" fill="#d8d3c8" xml:space="preserve">…</text>
</svg>
