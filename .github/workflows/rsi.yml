name: hush RSI
# CP123 (D2): the deterministic RSI engine (workflows/rsi.workflow.js, cluster E4) is
# $0/tokenless — refresh-tool-matrix-versions → re-verify-brain-pins → run-eval-pyramid
# → propose → test-gate. The schedule below is ENABLED. It is GUARDED-GREEN: if the
# engine isn't built yet it exits 0 (never a red merge surface). The Claude half of RSI
# additionally needs CLAUDE_CODE_OAUTH_TOKEN (chairman checklist, D8) — its absence is
# NOT a gap; the deterministic half runs without it.
on:
  # 09:17 UTC daily (off-peak; odd minute to avoid the top-of-hour GHA stampede).
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rsi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Detect runtime
        id: rt
        run: |
          if [ -f package.json ] && [ -f workflows/rsi.workflow.js ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.rt.outputs.armed == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.rt.outputs.armed == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Run deterministic RSI engine ($0, tokenless)
        if: steps.rt.outputs.armed == 'true'
        env:
          # gh release view needs a token on the runner; without it every upstream check was "unreachable".
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm install --frozen-lockfile || pnpm install
          # Build first: the RSI engine's eval step (`pnpm eval` → eval/run.mjs)
          # imports the compiled TypeScript from dist/, which is gitignored and
          # never committed. Without this, the eval pyramid fails with
          # ERR_MODULE_NOT_FOUND (dist/lib/false-green.js). Mirrors acceptance.yml.
          pnpm build
          # The deterministic engine: detects tool-version drift, re-verifies brain
          # pins, re-runs the eval pyramid, proposes (does NOT auto-commit). $0.
          node workflows/rsi.workflow.js
      - name: Keep the proposal for review (the runner is thrown away)
        if: always() && steps.rt.outputs.armed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rsi-proposal
          path: workflows/proposals/
          if-no-files-found: ignore
      - name: Engine guard (not built yet)
        if: steps.rt.outputs.armed == 'false'
        run: |
          echo "RSI engine (workflows/rsi.workflow.js, cluster E4) not present yet — exiting green."
          exit 0
      - name: Open or update the proposal issue for a person to review
        if: always() && hashFiles('workflows/proposals/rsi-*.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=(workflows/proposals/rsi-*.md)
          proposal=${files[${#files[@]}-1]}
          [ -s "$proposal" ] || { echo "The proposal file is empty, so no issue."; exit 0; }
          gh label create proposal --color 2f5d8a --description "A change the self-improvement loop proposes for a person to review" --force
          {
            echo "Written by the scheduled self-improvement loop on $(date -u '+%Y-%m-%d %H:%M UTC'). It proposes; a person decides. The loop never merges."
            echo
            cat "$proposal"
          } > "$RUNNER_TEMP/proposal-issue.md"
          number=$(gh issue list --label proposal --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/proposal-issue.md"
          else
            gh issue create --title "Hush: proposal from the self-improvement loop" --label proposal --body-file "$RUNNER_TEMP/proposal-issue.md"
          fi
